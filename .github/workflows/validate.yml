name: spec-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-examples:
    name: Validate examples against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 js-yaml@4
      - name: Validate example objects
        run: node scripts/validate-examples.mjs

  schema-lint:
    name: Lint JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 js-yaml@4
      - name: Parse and compile every schema
        run: node scripts/lint-schemas.mjs

  markdown-links:
    name: Check local Markdown links
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "./**/*.md"
          fail: true
