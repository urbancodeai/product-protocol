pp: "0.1"
kind: Observation
metadata:
  id: obs-incident-webhook-storm
  name: "Incident: webhook retry storm degraded charge latency"
  version: 1.0.0
  createdAt: 2026-06-25T12:00:00Z
spec:
  source: incident
  statement: >
    2026-06-25 02:10-08:40 UTC: a top-10 merchant's webhook endpoint
    went hard-down; fixed-interval retries synchronized into a storm of
    ~40k pending deliveries that saturated the shared dispatcher pool.
    Charge-path p99 rose to 540 ms and the 0.4.2 canary was
    automatically rolled back at the 25% step. No money movements were
    lost or duplicated.
  measurement:
    metric: charge_create_latency_p99
    value: 540
    unit: ms
  observedAt: 2026-06-25T09:00:00Z
  environment: production
  relatesTo:
    - ref: { kind: Issue, id: issue-webhook-retry-storm }
    - ref: { kind: Deployment, id: deploy-canary-042-r1 }
  severity: high
