pp: "0.1"
kind: Observation
metadata:
  id: obs-analytics-first-charge
  name: Median time-to-first-charge, June cohort
  version: 1.0.0
  createdAt: 2026-07-02T10:00:00Z
spec:
  source: analytics
  statement: >
    Merchants who signed up in June reached their first production
    charge in a median of 41 hours, down from the 72-hour baseline;
    the largest remaining delay cluster is webhook endpoint debugging.
  measurement:
    metric: median_time_to_first_charge
    value: 41
    unit: hours
  observedAt: 2026-07-02T10:00:00Z
  environment: production
  relatesTo:
    - ref: { kind: Goal, id: goal-time-to-first-charge }
  severity: info
