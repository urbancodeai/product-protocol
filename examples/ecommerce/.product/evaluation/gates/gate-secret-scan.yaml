# A blocking task-acceptance gate (PP-0008 §9): enforces Constitution
# Article SEC-1 on every submitted changeset.
pp: "0.1"
kind: QualityGate
metadata:
  id: gate-secret-scan
  name: No committed secrets
  version: 1.0.0
  createdAt: 2026-05-10T09:30:00Z
  updatedAt: 2026-05-10T09:30:00Z
spec:
  description: >
    No Task submission is accepted while a security evaluation of the
    changeset reports committed secrets, credentials, or API keys
    (Constitution Article SEC-1).
  trigger: task_acceptance
  mode: blocking
  requires:
    - description: >
        A current security-category evaluation of the submitted
        changeset passes the secret scan.
      selector:
        category: security
      verdict: pass
