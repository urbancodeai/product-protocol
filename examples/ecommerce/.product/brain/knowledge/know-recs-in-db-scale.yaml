spec:
  category: architectural
  subcategory: recommendations
  statement: >
    Collaborative filtering computed inside the primary database serves
    the "For you" shelf within the 300 ms budget at the current catalog
    size (~40k titles); a dedicated recommendation service is not
    justified below roughly 500k titles.
