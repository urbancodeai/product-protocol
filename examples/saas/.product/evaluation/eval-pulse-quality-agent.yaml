spec:
  description: >
    Agentic evaluator that exercises dashboards and sharing flows in a
    browser, attempts cross-tenant access with forged and foreign
    tokens, audits Constitution Articles, and scores performance
    against budgets. Runs on a different model configuration from all
    registered Workers.
