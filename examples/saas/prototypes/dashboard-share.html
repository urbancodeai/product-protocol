<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulseboard — Share Dialog (prototype)</title>
<style>
  :root { --ink: #1c2430; --muted: #64707e; --line: #dde3ea; --accent: #4956d8; --bg: #eef1f5; --warn-bg: #f7f3e8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
  dialog[open] { position: static; width: 100%; max-width: 26rem; border: 1px solid var(--line); border-radius: 12px;
                 padding: 0; box-shadow: 0 12px 32px rgba(28,36,48,0.18); }
  header { padding: 1.1rem 1.25rem 0.75rem; }
  h1 { margin: 0; font-size: 1.05rem; }
  p.audience { margin: 0.35rem 0 0; font-size: 0.82rem; color: var(--muted); }
  section { padding: 0.9rem 1.25rem; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 0.6rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0; font-size: 0.9rem; }
  .avatar { display: inline-block; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent);
            color: #fff; text-align: center; line-height: 1.6rem; font-size: 0.7rem; margin-right: 0.5rem; }
  select, .role { font-size: 0.82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.4rem; background: #fff; }
  .gated { background: var(--warn-bg); border-radius: 8px; padding: 0.75rem; }
  .gated p { margin: 0 0 0.5rem; font-size: 0.84rem; }
  .gated strong { display: block; font-size: 0.9rem; margin-bottom: 0.2rem; }
  a.upgrade { display: inline-block; font-size: 0.84rem; font-weight: 600; color: var(--accent); text-decoration: none; }
  a.upgrade:focus, button:focus, select:focus { outline: 3px solid #c3c9f5; outline-offset: 1px; }
  footer { padding: 0.9rem 1.25rem; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 0.6rem; }
  button { font-size: 0.88rem; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
  <dialog open aria-labelledby="share-title">
    <header>
      <h1 id="share-title">Share "Revenue overview"</h1>
      <p class="audience">Visible to <strong>4 members</strong> of Acme Analytics · no external links active</p>
    </header>
    <section aria-labelledby="members-h">
      <h2 id="members-h">Workspace members</h2>
      <ul>
        <li><span><span class="avatar" aria-hidden="true">JK</span>Jo Kim</span>
            <label>Role for Jo Kim: <select><option>can edit</option><option>can view</option></select></label></li>
        <li><span><span class="avatar" aria-hidden="true">RB</span>Ravi Batra</span>
            <label>Role for Ravi Batra: <select><option selected>can view</option><option>can edit</option></select></label></li>
      </ul>
    </section>
    <section aria-labelledby="external-h">
      <h2 id="external-h">External link</h2>
      <div class="gated">
        <p><strong>External share links are part of the Team plan.</strong>
        Send a revocable, read-only link to people outside your workspace.</p>
        <a class="upgrade" href="#plans">See Team plan →</a>
      </div>
    </section>
    <footer>
      <button type="button">Copy workspace link</button>
      <button type="button" class="primary">Done</button>
    </footer>
  </dialog>
</body>
</html>
